description: 'Good Glamm Group is an India-based content-to-commerce conglomerate
  in the personal care and cosmetics sector, founded in September 2021 by Darpan Sanghvi,
  Priyanka Gill, and Naiyya Saggi and briefly valued as a unicorn after 2021 Series D
  funding. Its house of brands includes MyGlamm, St.Botanica, The Moms Co, Sirona,
  Organic Harvest, POPxo, ScoopWhoop, BabyChakra, MissMalini, and Tweak, spanning
  India, Dubai, Singapore, and the USA. The group was surfaced as a portfolio company
  of Bessemer Venture Partners and Prosus Ventures. As of this enrichment pass the
  goodglamm.com domain serves a Corporate Insolvency Resolution Process (CIRP)
  stakeholder portal, and no public developer API or documentation surface was found.'
